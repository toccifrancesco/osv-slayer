# Builds Linux (AppImage), Windows (zip) and macOS (dmg) packages.
#   - push a tag like v0.1.0      -> builds all three and publishes a GitHub release
#   - "Run workflow" in the Actions tab -> builds only (download the files from the run page)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  UV_PYTHON_PREFERENCE: only-system   # build with the standard CPython from setup-python
  QT_QPA_PLATFORM: offscreen

jobs:
  linux:
    # oldest supported runner = oldest glibc = AppImage runs on more distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin file \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Build AppImage
        run: packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra build --extra dev
      - name: Tests
        run: uv run --no-sync python -m pytest -q
      - name: Build zip
        run: uv run --no-sync python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra build --extra dev
      - name: Tests
        run: uv run --no-sync python -m pytest -q
      - name: Build dmg
        run: uv run --no-sync python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "osv360 ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md
