name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.4.0   # this action only publishes full version tags
      - name: System packages (ffmpeg for container tests, Qt runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        env: { UV_PYTHON_PREFERENCE: only-system }
        run: uv sync --extra gui --extra dev
      - name: Tests
        env: { QT_QPA_PLATFORM: offscreen }
        run: uv run --no-sync python -m pytest -q
      - name: Self-test
        env: { QT_QPA_PLATFORM: offscreen }
        run: uv run --no-sync osv360 selftest
