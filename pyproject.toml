[project]
name = "osv360"
version = "0.1.0"
description = "DJI Osmo 360 .OSV -> stabilized equirectangular video (GPU stitching, IMU horizon lock)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "wgpu>=0.22",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
gui = ["pyside6-essentials>=6.8"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.16", "pyside6-essentials>=6.8"]

[project.scripts]
osv360 = "osv360.cli:main"

[project.gui-scripts]
osv360-gui = "osv360.gui.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osv360"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
